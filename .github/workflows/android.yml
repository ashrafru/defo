name: Build Android app
on:
  push:
    branches: [workbench-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx cap sync android
      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Publish unsigned APK to the apk-builds branch
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -la $APK
          cp $APK /tmp/unsigned.apk
          git config user.name "workbench-build"; git config user.email "actions@users.noreply.github.com"
          git fetch origin apk-builds --depth 1
          git checkout -B apk-builds FETCH_HEAD
          mkdir -p unsigned && cp /tmp/unsigned.apk unsigned/AstrologersWorkbench-2.0.1-unsigned.apk
          echo "${GITHUB_SHA}" > unsigned/source-commit.txt
          git add unsigned && git commit -m "Unsigned build from ${GITHUB_SHA}" && git push origin apk-builds
      - uses: actions/upload-artifact@v4
        with: { name: unsigned-apk, path: android/app/build/outputs/apk/release/app-release-unsigned.apk }
